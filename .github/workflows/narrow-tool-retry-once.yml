name: Narrow tool retry once

on:
  push:
    branches:
      - agent/windows-discovery-snapshot

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restrict sequential retries to Windows shims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/toolchain.rs')
          text = path.read_text()

          text = text.replace(
              '            None => retry.push(spec),\n',
              '            None if should_retry_sequentially(spec) => retry.push(spec),\n            None => {}\n',
              1,
          )
          text = text.replace(
              '// Cold package-manager shims can contend when the parallel pass starts several\n'
              '// Node-family commands at once. Retry only failed probes sequentially so one cold\n'
              '// launcher does not disappear from the snapshot while the common path stays fast.\n',
              '// Windows package-manager shims can contend when several runtimes start at once.\n'
              '// Give only those launchers one clean sequential retry; unrelated broken SDKs must\n'
              '// never turn discovery into a chain of timeout delays.\n',
              1,
          )

          marker = 'fn discover_one(spec: ToolSpec) -> Option<ToolVersion> {'
          helper = '''#[cfg(windows)]
          fn should_retry_sequentially(spec: ToolSpec) -> bool {
              resolve_executable(spec.command)
                  .map(|path| {
                      let path = path.to_ascii_lowercase();
                      path.ends_with(".cmd") || path.ends_with(".bat")
                  })
                  .unwrap_or(false)
          }

          #[cfg(not(windows))]
          fn should_retry_sequentially(_spec: ToolSpec) -> bool {
              false
          }

          fn discover_one(spec: ToolSpec) -> Option<ToolVersion> {'''

          if 'fn should_retry_sequentially' not in text:
              if marker not in text:
                  raise SystemExit('discover_one marker not found')
              text = text.replace(marker, helper, 1)

          if 'None if should_retry_sequentially(spec)' not in text:
              raise SystemExit('retry condition was not inserted')

          path.write_text(text)
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all

      - name: Commit optimization
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Context Capsule CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/toolchain.rs
          git commit -m "bound developer tool retries"
          git push origin HEAD:${GITHUB_REF_NAME}
