name: Format Feature Branch

on:
  push:
    branches:
      - feature/chrome-browser-adapter-20260822
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Verify POTUS runner and Rust tools
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected runner POTUS, got '${{ runner.name }}'" }
          Get-Command cargo -ErrorAction Stop | Format-List Source
          Get-Command rustup -ErrorAction Stop | Format-List Source
          rustup component add rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'could not install/enable rustfmt' }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply canonical Rust formatting
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }

      - name: Make Windows self-hosted jobs compatible with Windows PowerShell
        run: |
          $workflowPaths = @(
            '.github/workflows/rust.yml',
            '.github/workflows/restore-engine.yml',
            '.github/workflows/firefox-native-host.yml',
            '.github/workflows/chrome-native-host.yml',
            '.github/workflows/zen-native-messaging-e2e.yml'
          )

          foreach ($path in $workflowPaths) {
            $text = Get-Content $path -Raw
            $text = $text.Replace('shell: pwsh', 'shell: powershell')
            $marker = "    runs-on: [self-hosted, Windows, X64]`n"
            if (-not $text.Contains($marker)) {
              $marker = "    runs-on: [self-hosted, Windows, X64]`r`n"
            }
            if ($text.Contains($marker)) {
              $newline = if ($marker.Contains("`r`n")) { "`r`n" } else { "`n" }
              $replacement = $marker + "    defaults:$newline      run:$newline        shell: powershell$newline"
              $text = $text.Replace($marker, $replacement)
            }
            Set-Content -Path $path -Value $text -Encoding utf8
          }

      - name: Verify formatting result
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'repository is still not rustfmt-clean' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'mechanical edits introduced whitespace errors' }

      - name: Commit mechanical fixes if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git status --short
          git diff --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Sources and workflows are already normalized.'
            exit 0
          }
          $global:LASTEXITCODE = 0
          git config user.name 'Context Capsule CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests .github/workflows/rust.yml .github/workflows/restore-engine.yml .github/workflows/firefox-native-host.yml .github/workflows/chrome-native-host.yml .github/workflows/zen-native-messaging-e2e.yml
          git commit -m 'style: apply rustfmt and Windows CI shell compatibility'
          if ($LASTEXITCODE -ne 0) { throw 'format commit failed' }
          git push origin "HEAD:${env:GITHUB_REF_NAME}"
          if ($LASTEXITCODE -ne 0) { throw 'format commit push failed' }

# rerun requested after POTUS/POTUS-linux dependency setup
