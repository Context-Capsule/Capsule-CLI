name: Export Self-Hosted CI Patch

on:
  push:
    branches:
      - feature/chrome-browser-adapter-20260822
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: export-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected POTUS, got '${{ runner.name }}'" }

      - uses: actions/checkout@v4

      - name: Generate patched Windows workflows
        shell: pwsh
        run: |
          $paths = @(
            '.github/workflows/rust.yml',
            '.github/workflows/restore-engine.yml',
            '.github/workflows/firefox-native-host.yml',
            '.github/workflows/chrome-native-host.yml',
            '.github/workflows/zen-native-messaging-e2e.yml'
          )

          $replacement = @(
            '      - name: Ensure stable Rust toolchain',
            '        shell: pwsh',
            '        run: |',
            '          Get-Command rustup -ErrorAction Stop | Format-List Source',
            '          rustup toolchain install stable --component rustfmt --profile minimal --no-self-update',
            "          if (`$LASTEXITCODE -ne 0) { throw 'rustup stable install failed' }",
            '          rustup default stable',
            "          if (`$LASTEXITCODE -ne 0) { throw 'rustup default stable failed' }",
            '          rustc --version',
            "          if (`$LASTEXITCODE -ne 0) { throw 'rustc is unavailable after rustup setup' }",
            '          cargo --version',
            "          if (`$LASTEXITCODE -ne 0) { throw 'cargo is unavailable after rustup setup' }"
          )

          foreach ($path in $paths) {
            $lines = @(Get-Content -Path $path)
            $output = [System.Collections.Generic.List[string]]::new()
            $windowsJob = $false
            $i = 0
            while ($i -lt $lines.Count) {
              $line = [string]$lines[$i]
              if ($line -match '^  [A-Za-z0-9_-]+:\s*$') { $windowsJob = $false }
              if ($line.Contains('runs-on: [self-hosted, Windows, X64]')) { $windowsJob = $true }
              if ($windowsJob -and $line.Trim() -eq '- uses: dtolnay/rust-toolchain@stable') {
                foreach ($replacementLine in $replacement) { $output.Add($replacementLine) }
                $i++
                while ($i -lt $lines.Count) {
                  $candidate = [string]$lines[$i]
                  $indent = $candidate.Length - $candidate.TrimStart(' ').Length
                  if ($candidate.Trim().Length -gt 0 -and $indent -le 6) { break }
                  $i++
                }
                continue
              }
              $output.Add($line)
              $i++
            }
            Set-Content -Path $path -Value $output -Encoding utf8
          }

      - name: Export patched files
        shell: pwsh
        run: |
          foreach ($path in @('.github/workflows/rust.yml','.github/workflows/restore-engine.yml','.github/workflows/firefox-native-host.yml','.github/workflows/chrome-native-host.yml','.github/workflows/zen-native-messaging-e2e.yml')) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
            $encoded = [Convert]::ToBase64String($bytes)
            Write-Host "CAPSULE_FILE_BEGIN::$path"
            Write-Host $encoded
            Write-Host "CAPSULE_FILE_END::$path"
          }

      - name: Publish exporter status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } elseif ($env:JOB_STATUS -eq 'cancelled') { 'error' } else { 'failure' }
          $body = @{
            state = $state
            context = 'ci/potus-workflow-export'
            description = "POTUS workflow export: $($env:JOB_STATUS)"
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
