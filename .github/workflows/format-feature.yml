name: Finalize Self-Hosted CI

on:
  push:
    branches:
      - feature/chrome-browser-adapter-20260822
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: finalize-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected POTUS, got '${{ runner.name }}'" }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Replace Windows Rust action with installed rustup
        shell: pwsh
        run: |
          $paths = @(
            '.github/workflows/rust.yml',
            '.github/workflows/restore-engine.yml',
            '.github/workflows/firefox-native-host.yml',
            '.github/workflows/chrome-native-host.yml',
            '.github/workflows/zen-native-messaging-e2e.yml'
          )

          $replacement = @(
            '      - name: Ensure stable Rust toolchain',
            '        shell: pwsh',
            '        run: |',
            '          Get-Command rustup -ErrorAction Stop | Format-List Source',
            '          rustup toolchain install stable --component rustfmt --profile minimal --no-self-update',
            "          if (`$LASTEXITCODE -ne 0) { throw 'rustup stable install failed' }",
            '          rustup default stable',
            "          if (`$LASTEXITCODE -ne 0) { throw 'rustup default stable failed' }",
            '          rustc --version',
            "          if (`$LASTEXITCODE -ne 0) { throw 'rustc is unavailable after rustup setup' }",
            '          cargo --version',
            "          if (`$LASTEXITCODE -ne 0) { throw 'cargo is unavailable after rustup setup' }"
          )

          foreach ($path in $paths) {
            $lines = @(Get-Content -Path $path)
            $output = [System.Collections.Generic.List[string]]::new()
            $windowsJob = $false
            $i = 0

            while ($i -lt $lines.Count) {
              $line = [string]$lines[$i]
              if ($line -match '^  [A-Za-z0-9_-]+:\s*$') { $windowsJob = $false }
              if ($line.Contains('runs-on: [self-hosted, Windows, X64]')) { $windowsJob = $true }

              if ($windowsJob -and $line.Trim() -eq '- uses: dtolnay/rust-toolchain@stable') {
                foreach ($replacementLine in $replacement) { $output.Add($replacementLine) }
                $i++
                while ($i -lt $lines.Count) {
                  $candidate = [string]$lines[$i]
                  $indent = $candidate.Length - $candidate.TrimStart(' ').Length
                  if ($candidate.Trim().Length -gt 0 -and $indent -le 6) { break }
                  $i++
                }
                continue
              }

              $output.Add($line)
              $i++
            }

            Set-Content -Path $path -Value $output -Encoding utf8

            $checkLines = @(Get-Content -Path $path)
            $insideWindows = $false
            foreach ($checkLine in $checkLines) {
              if ($checkLine -match '^  [A-Za-z0-9_-]+:\s*$') { $insideWindows = $false }
              if ($checkLine.Contains('runs-on: [self-hosted, Windows, X64]')) { $insideWindows = $true }
              if ($insideWindows -and $checkLine.Contains('dtolnay/rust-toolchain@stable')) {
                throw "$path still contains dtolnay/rust-toolchain inside a Windows job"
              }
            }
          }

      - name: Validate and push migration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'workflow edits contain whitespace errors' }

          foreach ($path in @('.github/workflows/rust.yml','.github/workflows/restore-engine.yml','.github/workflows/firefox-native-host.yml','.github/workflows/chrome-native-host.yml','.github/workflows/zen-native-messaging-e2e.yml')) {
            if (-not (Select-String -Path $path -SimpleMatch 'Ensure stable Rust toolchain' -Quiet)) {
              throw "$path was not migrated"
            }
          }

          git rm .github/workflows/format-feature.yml
          if ($LASTEXITCODE -ne 0) { throw 'could not remove one-shot migration workflow' }

          git fetch origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'could not refresh branch before push' }
          $remoteSha = (git rev-parse "origin/$env:GITHUB_REF_NAME").Trim()
          if ($remoteSha -ne $env:GITHUB_SHA) {
            throw "branch moved while migration was running: expected $env:GITHUB_SHA, found $remoteSha"
          }

          git config user.name 'Context Capsule CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: make Windows Rust setup self-hosted-safe'
          if ($LASTEXITCODE -ne 0) { throw 'migration commit failed' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'migration push failed' }

      - name: Publish finalizer status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } elseif ($env:JOB_STATUS -eq 'cancelled') { 'error' } else { 'failure' }
          $body = @{
            state = $state
            context = 'ci/potus-finalizer'
            description = "POTUS CI finalizer: $($env:JOB_STATUS)"
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
