name: Generate lockfile once

on:
  push:
    branches:
      - agent/sqlite-persistence-docker-adapter

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "Context Capsule CI"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "lock persistence dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
