name: Firefox Native Host

on:
  push:
    branches: [main, 'agent/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-host-windows:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected runner POTUS, got '${{ runner.name }}'" }
      - uses: actions/checkout@v4
      - name: Ensure stable Rust toolchain
        shell: pwsh
        run: |
          Get-Command rustup -ErrorAction Stop | Format-List Source
          rustup toolchain install stable --component rustfmt --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup stable install failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'rustup default stable failed' }
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'rustc is unavailable after rustup setup' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'cargo is unavailable after rustup setup' }
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo test
      - run: cargo build --bin capsule-firefox-host
      - name: Register, diagnose, and unregister Firefox/Zen host
        shell: pwsh
        env:
          CONTEXT_CAPSULE_FIREFOX_MANIFEST_PATH: ${{ runner.temp }}\com.contextcapsule.host.json
        run: |
          .\target\debug\capsule-firefox-host.exe --install
          .\target\debug\capsule-firefox-host.exe --doctor
          if (-not (Test-Path $env:CONTEXT_CAPSULE_FIREFOX_MANIFEST_PATH)) { throw 'native messaging manifest was not created' }
          $registryPath = 'Registry::HKEY_CURRENT_USER\Software\Mozilla\NativeMessagingHosts\com.contextcapsule.host'
          if (-not (Test-Path $registryPath)) { throw 'native messaging registry key was not created' }
          $registeredManifest = (Get-Item $registryPath).GetValue('')
          if ($registeredManifest -ne $env:CONTEXT_CAPSULE_FIREFOX_MANIFEST_PATH) { throw "registry points to '$registeredManifest' instead of '$env:CONTEXT_CAPSULE_FIREFOX_MANIFEST_PATH'" }
          .\target\debug\capsule-firefox-host.exe --uninstall
          if (Test-Path $registryPath) { throw 'native messaging registry key remained after uninstall' }
      - name: Publish Firefox Windows status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } elseif ($env:JOB_STATUS -eq 'cancelled') { 'error' } else { 'failure' }
          $body = @{ state = $state; context = 'ci/potus-firefox-host'; description = "POTUS Firefox host: $($env:JOB_STATUS)" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null

  protocol-integration-linux:
    runs-on: [self-hosted, Linux, X64]
    env:
      HOME: ${{ runner.temp }}/context-capsule-firefox-home
      CONTEXT_CAPSULE_DB: ${{ runner.temp }}/context-capsule-firefox.db
      CONTEXT_CAPSULE_FIREFOX_STATE_PATH: ${{ runner.temp }}/context-capsule-firefox-state.json
    steps:
      - name: Verify POTUS-linux runner
        shell: bash
        run: |
          set -euo pipefail
          test '${{ runner.name }}' = 'POTUS-linux' || { echo "Expected runner POTUS-linux, got '${{ runner.name }}'" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --bins
      - name: Install and diagnose native host manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          ./target/debug/capsule-firefox-host --install
          ./target/debug/capsule-firefox-host --doctor
          test -f "$HOME/.mozilla/native-messaging-hosts/com.contextcapsule.host.json"
          grep -F 'firefox@contextcapsule.app' "$HOME/.mozilla/native-messaging-hosts/com.contextcapsule.host.json"
      - name: Exercise framed ping and live-state update
        shell: bash
        run: |
          python3 - <<'PY'
          import json, struct, subprocess
          host = './target/debug/capsule-firefox-host'
          snapshot = {
              'schema_version': 1,
              'browser': 'firefox',
              'extension_version': 'ci',
              'captured_at_unix_ms': 1,
              'skipped_private_windows': 0,
              'windows': [{
                  'key': 'window-0', 'focused': True, 'state': 'normal',
                  'left': 0, 'top': 0, 'width': 1200, 'height': 800,
                  'tabs': [{
                      'index': 0, 'url': 'https://example.com', 'title': 'Example',
                      'pinned': False, 'active': True, 'discarded': False,
                      'muted': False, 'restorable': True
                  }],
                  'groups': []
              }]
          }
          requests = [
              {'protocol_version': 1, 'request_id': 'ping', 'type': 'ping'},
              {'protocol_version': 1, 'request_id': 'state', 'type': 'browser.state.update', 'snapshot': snapshot},
          ]
          payload = b''.join(struct.pack('<I', len(raw)) + raw for raw in [json.dumps(r).encode() for r in requests])
          proc = subprocess.run([host], input=payload, stdout=subprocess.PIPE, check=True)
          data = proc.stdout
          responses = []
          while data:
              size = struct.unpack('<I', data[:4])[0]
              responses.append(json.loads(data[4:4+size]))
              data = data[4+size:]
          assert responses[0]['type'] == 'pong' and responses[0]['ok']
          assert responses[1]['type'] == 'browser.state.updated' and responses[1]['ok']
          PY
      - name: Save live Firefox state into SQLite capsule
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/capsule save firefox-ci
          ./target/debug/capsule show firefox-ci --json > "$RUNNER_TEMP/firefox-capsule.json"
          grep -F '"firefox"' "$RUNNER_TEMP/firefox-capsule.json"
          grep -F 'https://example.com' "$RUNNER_TEMP/firefox-capsule.json"
      - name: Publish Firefox Linux protocol status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          [ "$JOB_STATUS" = success ] && state=success
          [ "$JOB_STATUS" = cancelled ] && state=error
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$state\",\"context\":\"ci/potus-linux-firefox-protocol\",\"description\":\"POTUS-linux Firefox protocol: $JOB_STATUS\"}" >/dev/null
