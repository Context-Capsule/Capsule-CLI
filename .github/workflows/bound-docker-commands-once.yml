name: Bound Docker commands once

on:
  push:
    branches:
      - agent/sqlite-persistence-docker-adapter

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bounded Docker command execution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/adapters/docker.rs')
          text = path.read_text()

          old_import = '''use std::{
              collections::{BTreeMap, BTreeSet},
              path::Path,
              process::Command,
          };
          '''
          new_import = '''use std::{
              collections::{BTreeMap, BTreeSet},
              fs::{self, File},
              path::{Path, PathBuf},
              process::{Command, ExitStatus, Output, Stdio},
              sync::atomic::{AtomicU64, Ordering},
              thread,
              time::{Duration, Instant, SystemTime, UNIX_EPOCH},
          };
          '''
          if old_import not in text:
              raise SystemExit('import block did not match')
          text = text.replace(old_import, new_import, 1)

          marker = 'const COMPOSE_CONFIG_FILES_LABEL: &str = "com.docker.compose.project.config_files";\n'
          constants = marker + '''const DOCKER_DISCOVERY_TIMEOUT: Duration = Duration::from_secs(8);
          const DOCKER_RESTORE_TIMEOUT: Duration = Duration::from_secs(90);
          const DOCKER_POLL_INTERVAL: Duration = Duration::from_millis(50);
          static CAPTURE_FILE_COUNTER: AtomicU64 = AtomicU64::new(0);
          '''
          if marker not in text:
              raise SystemExit('constant marker did not match')
          text = text.replace(marker, constants, 1)

          old_output = '''fn docker_output(args: &[&str]) -> Result<String, String> {
              let output = Command::new("docker")
                  .args(args)
                  .output()
                  .map_err(|error| format!("failed to run 'docker {}': {error}", args.join(" ")))?;

              if !output.status.success() {
                  let stderr = String::from_utf8_lossy(&output.stderr).trim().to_owned();
                  let stdout = String::from_utf8_lossy(&output.stdout).trim().to_owned();
                  let detail = if !stderr.is_empty() { stderr } else { stdout };
                  return Err(if detail.is_empty() {
                      format!("'docker {}' exited with {}", args.join(" "), output.status)
                  } else {
                      detail
                  });
              }

              Ok(String::from_utf8_lossy(&output.stdout).trim().to_owned())
          }
          '''
          new_output = '''fn docker_output(args: &[&str]) -> Result<String, String> {
              let output = run_docker_command(args, DOCKER_DISCOVERY_TIMEOUT, None)?;

              if !output.status.success() {
                  let stderr = String::from_utf8_lossy(&output.stderr).trim().to_owned();
                  let stdout = String::from_utf8_lossy(&output.stdout).trim().to_owned();
                  let detail = if !stderr.is_empty() { stderr } else { stdout };
                  return Err(if detail.is_empty() {
                      format!("'docker {}' exited with {}", args.join(" "), output.status)
                  } else {
                      detail
                  });
              }

              Ok(String::from_utf8_lossy(&output.stdout).trim().to_owned())
          }
          '''
          if old_output not in text:
              raise SystemExit('docker_output block did not match')
          text = text.replace(old_output, new_output, 1)

          old_compose = '''        let mut command = Command::new("docker");
                  command.args(&arg_refs);
                  if usable_working_directory {
                      if let Some(directory) = project.working_directory.as_ref() {
                          command.current_dir(directory);
                      }
                  }

                  let output = command.output().map_err(|error| {
                      format!(
                          "Compose project '{}': failed to start Docker Compose: {error}",
                          project.name
                      )
                  })?;
          '''
          new_compose = '''        let working_directory = if usable_working_directory {
                      project.working_directory.as_deref().map(Path::new)
                  } else {
                      None
                  };
                  let output = run_docker_command(
                      &arg_refs,
                      DOCKER_RESTORE_TIMEOUT,
                      working_directory,
                  )
                  .map_err(|error| {
                      format!(
                          "Compose project '{}': failed to start Docker Compose: {error}",
                          project.name
                      )
                  })?;
          '''
          if old_compose not in text:
              raise SystemExit('compose execution block did not match')
          text = text.replace(old_compose, new_compose, 1)

          old_existing = '''fn restore_existing_container(container: &ContainerResource) -> Result<(), String> {
              let inspect = Command::new("docker")
                  .args(["inspect", "--type", "container", &container.name])
                  .output()
                  .map_err(|error| {
                      format!(
                          "Container '{}': failed to query Docker: {error}",
                          container.name
                      )
                  })?;

              if !inspect.status.success() {
                  return Err(format!(
                      "Container '{}' no longer exists. Context Capsule will not recreate a standalone container because environment variables and other secret-bearing runtime configuration are intentionally not captured",
                      container.name
                  ));
              }

              let output = Command::new("docker")
                  .args(["start", &container.name])
                  .output()
                  .map_err(|error| format!("Container '{}': failed to start: {error}", container.name))?;

              if output.status.success() {
                  Ok(())
              } else {
                  let detail = String::from_utf8_lossy(&output.stderr).trim().to_owned();
                  Err(format!(
                      "Container '{}': docker start failed{}",
                      container.name,
                      if detail.is_empty() {
                          String::new()
                      } else {
                          format!(": {detail}")
                      }
                  ))
              }
          }
          '''
          new_existing = '''fn restore_existing_container(container: &ContainerResource) -> Result<(), String> {
              let inspect_args = [
                  "inspect",
                  "--type",
                  "container",
                  "--format",
                  "{{.State.Running}}",
                  container.name.as_str(),
              ];
              let inspect = run_docker_command(&inspect_args, DOCKER_DISCOVERY_TIMEOUT, None)
                  .map_err(|error| {
                      format!(
                          "Container '{}': failed to query Docker: {error}",
                          container.name
                      )
                  })?;

              if !inspect.status.success() {
                  return Err(format!(
                      "Container '{}' no longer exists. Context Capsule will not recreate a standalone container because environment variables and other secret-bearing runtime configuration are intentionally not captured",
                      container.name
                  ));
              }

              if String::from_utf8_lossy(&inspect.stdout).trim() == "true" {
                  return Ok(());
              }

              let start_args = ["start", container.name.as_str()];
              let output = run_docker_command(&start_args, DOCKER_RESTORE_TIMEOUT, None)
                  .map_err(|error| format!("Container '{}': failed to start: {error}", container.name))?;

              if output.status.success() {
                  Ok(())
              } else {
                  let detail = String::from_utf8_lossy(&output.stderr).trim().to_owned();
                  Err(format!(
                      "Container '{}': docker start failed{}",
                      container.name,
                      if detail.is_empty() {
                          String::new()
                      } else {
                          format!(": {detail}")
                      }
                  ))
              }
          }
          '''
          if old_existing not in text:
              raise SystemExit('standalone restore block did not match')
          text = text.replace(old_existing, new_existing, 1)

          test_marker = '\n#[cfg(test)]\nmod tests {'
          helper = r'''
          fn run_docker_command(
              args: &[&str],
              timeout: Duration,
              working_directory: Option<&Path>,
          ) -> Result<Output, String> {
              let description = format!("docker {}", args.join(" "));
              let capture = CaptureFiles::create()
                  .ok_or_else(|| format!("failed to create output capture files for '{description}'"))?;
              let mut command = Command::new("docker");
              command.args(args);
              if let Some(directory) = working_directory {
                  command.current_dir(directory);
              }
              command
                  .stdout(Stdio::from(
                      capture
                          .stdout_writer
                          .as_ref()
                          .and_then(|file| file.try_clone().ok())
                          .ok_or_else(|| format!("failed to capture stdout for '{description}'"))?,
                  ))
                  .stderr(Stdio::from(
                      capture
                          .stderr_writer
                          .as_ref()
                          .and_then(|file| file.try_clone().ok())
                          .ok_or_else(|| format!("failed to capture stderr for '{description}'"))?,
                  ));

              let mut child = command
                  .spawn()
                  .map_err(|error| format!("failed to run '{description}': {error}"))?;
              let started = Instant::now();
              let status = loop {
                  match child.try_wait() {
                      Ok(Some(status)) => break status,
                      Ok(None) if started.elapsed() < timeout => thread::sleep(DOCKER_POLL_INTERVAL),
                      Ok(None) => {
                          let _ = child.kill();
                          let _ = child.wait();
                          return Err(format!(
                              "'{description}' timed out after {} second(s)",
                              timeout.as_secs()
                          ));
                      }
                      Err(error) => {
                          let _ = child.kill();
                          let _ = child.wait();
                          return Err(format!("failed while waiting for '{description}': {error}"));
                      }
                  }
              };

              capture
                  .finish(status)
                  .ok_or_else(|| format!("failed to read output from '{description}'"))
          }

          struct CaptureFiles {
              stdout_path: PathBuf,
              stderr_path: PathBuf,
              stdout_writer: Option<File>,
              stderr_writer: Option<File>,
          }

          impl CaptureFiles {
              fn create() -> Option<Self> {
                  let id = CAPTURE_FILE_COUNTER.fetch_add(1, Ordering::Relaxed);
                  let timestamp = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .ok()?
                      .as_nanos();
                  let prefix = format!(
                      "context-capsule-docker-{}-{timestamp}-{id}",
                      std::process::id()
                  );
                  let directory = std::env::temp_dir();
                  let stdout_path = directory.join(format!("{prefix}.stdout"));
                  let stderr_path = directory.join(format!("{prefix}.stderr"));
                  let stdout_writer = File::create(&stdout_path).ok()?;
                  let stderr_writer = match File::create(&stderr_path) {
                      Ok(file) => file,
                      Err(_) => {
                          let _ = fs::remove_file(&stdout_path);
                          return None;
                      }
                  };

                  Some(Self {
                      stdout_path,
                      stderr_path,
                      stdout_writer: Some(stdout_writer),
                      stderr_writer: Some(stderr_writer),
                  })
              }

              fn close_writers(&mut self) {
                  drop(self.stdout_writer.take());
                  drop(self.stderr_writer.take());
              }

              fn finish(mut self, status: ExitStatus) -> Option<Output> {
                  self.close_writers();
                  let stdout = fs::read(&self.stdout_path).unwrap_or_default();
                  let stderr = fs::read(&self.stderr_path).unwrap_or_default();
                  let _ = fs::remove_file(&self.stdout_path);
                  let _ = fs::remove_file(&self.stderr_path);
                  Some(Output {
                      status,
                      stdout,
                      stderr,
                  })
              }
          }

          impl Drop for CaptureFiles {
              fn drop(&mut self) {
                  self.close_writers();
                  let _ = fs::remove_file(&self.stdout_path);
                  let _ = fs::remove_file(&self.stderr_path);
              }
          }
          '''
          if test_marker not in text:
              raise SystemExit('test marker did not match')
          text = text.replace(test_marker, '\n' + helper + test_marker, 1)

          path.write_text(text)
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo test
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "Context Capsule CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/adapters/docker.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bound Docker command execution"
          git push origin HEAD:${GITHUB_REF_NAME}
