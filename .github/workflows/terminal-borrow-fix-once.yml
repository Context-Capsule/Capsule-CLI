name: Terminal Borrow Fix Once

on:
  push:
    branches: [agent/terminal-adapter]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[terminal-borrow-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terminal-adapter
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply borrow-safe WSL leaf-shell filtering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/adapters/terminal.rs')
          text = path.read_text()
          needle = "    sessions.retain(|candidate| {\n        !sessions.iter().any(|other| {"
          replacement = "    let all_sessions = sessions.clone();\n    sessions.retain(|candidate| {\n        !all_sessions.iter().any(|other| {"
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one WSL retain block, found {count}')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          cargo fmt --all
          git config user.name 'GPT Slave'
          git config user.email 'unknown.entiti911@gmail.com'
          git add src/adapters/terminal.rs
          git commit -m 'fix WSL shell filtering borrow [terminal-borrow-fix]'
          git push origin HEAD:agent/terminal-adapter
