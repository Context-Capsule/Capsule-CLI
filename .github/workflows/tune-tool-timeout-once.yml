name: Tune tool timeout once

on:
  push:
    branches:
      - agent/windows-discovery-snapshot

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase bounded tool probe timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/toolchain.rs')
          text = path.read_text()
          old = 'const TOOL_VERSION_TIMEOUT: Duration = Duration::from_secs(3);'
          new = 'const TOOL_VERSION_TIMEOUT: Duration = Duration::from_secs(10);'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('tool timeout constant not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit tuning
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Context Capsule CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/toolchain.rs
          git commit -m "tune developer tool probe timeout"
          git push origin HEAD:${GITHUB_REF_NAME}
