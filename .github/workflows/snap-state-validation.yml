name: Snap State Validation

on:
  push:
    branches:
      - 'fix/snap-state-preservation-20260830'
    paths:
      - 'src/desktop/windows.rs'
      - 'src/restore/windows.rs'
      - '.github/workflows/snap-state-validation.yml'

permissions:
  contents: read

concurrency:
  group: snap-state-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-snap-state:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected POTUS, got '${{ runner.name }}'" }

      - uses: actions/checkout@v4

      - name: Ensure stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup stable install failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'rustup default stable failed' }
          rustc --version
          cargo --version

      - name: Check all targets
        run: cargo check --all-targets

      - name: Desktop window-state capture tests
        run: cargo test desktop::windows::tests -- --nocapture

      - name: Windows restore state tests
        run: cargo test restore::windows::tests -- --nocapture
