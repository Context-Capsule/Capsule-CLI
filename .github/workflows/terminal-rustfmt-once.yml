name: Terminal Rustfmt Once

on:
  push:
    branches: [agent/terminal-adapter]

permissions:
  contents: write

jobs:
  rustfmt:
    if: "!contains(github.event.head_commit.message, '[terminal-rustfmt]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terminal-adapter
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources and push
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'GPT Slave'
          git config user.email 'unknown.entiti911@gmail.com'
          git add '*.rs' 'src/**/*.rs'
          git commit -m 'format terminal adapter [terminal-rustfmt]'
          git push origin HEAD:agent/terminal-adapter
