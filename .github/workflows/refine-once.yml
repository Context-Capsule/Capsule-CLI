name: Refine once

on:
  push:
    branches:
      - agent/windows-discovery-snapshot

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve off-desktop windows
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/desktop/windows.rs")
          text = path.read_text()
          old = "if unsafe { IsWindowVisible(hwnd) } == 0 || is_cloaked(hwnd) {\n        return 1;\n    }"
          new = "// Windows commonly DWM-cloaks windows that live on another virtual desktop.\n    // Keep visible-style windows here and let IVirtualDesktopManager identify their desktop.\n    if unsafe { IsWindowVisible(hwnd) } == 0 {\n        return 1;\n    }"

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("expected window-enumeration guard was not found")

          text = text.replace("const DWMWA_CLOAKED: u32 = 14;\n", "", 1)

          marker = "fn is_cloaked(hwnd: Hwnd) -> bool {"
          if marker in text:
              start = text.index(marker)
              end = text.index("fn window_bounds", start)
              text = text[:start] + text[end:]

          path.write_text(text)

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format source
        run: cargo fmt --all

      - name: Commit refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No refinement was needed."
            exit 0
          fi

          git config user.name "Context Capsule CI"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "preserve virtual desktop windows"
          git push origin HEAD:${GITHUB_REF_NAME}
