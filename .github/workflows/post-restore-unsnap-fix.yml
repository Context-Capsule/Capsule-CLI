name: Post Restore Unsnap Fix Validation

on:
  push:
    branches:
      - 'fix/post-restore-unsnap-20260902'

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale validation holding POTUS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/cancel.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Context-Capsule/Capsule-CLI/actions/runs/33575195088/force-cancel)
          cat /tmp/cancel.out || true
          case "$code" in
            202|409) exit 0 ;;
            *) echo "Unexpected force-cancel status: $code"; exit 1 ;;
          esac

  compile-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-restore-unsnap-20260902

      - name: Run Rust test suite except unrelated environment-sensitive Git baseline
        shell: pwsh
        run: cargo test --all-targets -- --skip git_context::tests::live_terminal_value_contributes_repo_omitted_from_durable_terminal_snapshot

      - name: Run focused Snap stability check on hosted Windows
        shell: pwsh
        env:
          SNAP_LIVE_OUT: ${{ runner.temp }}\context-capsule-hosted-post-unsnap-${{ github.run_id }}
        run: cargo test --test windows_snap_live live_forced_final_pass_does_not_unsnap_after_foreground_reconciliation -- --ignored --nocapture --test-threads=1

  live-snap:
    needs: [cancel-stale-validation, compile-test]
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected POTUS, got '${{ runner.name }}'" }

      - uses: actions/checkout@v4
        with:
          ref: fix/post-restore-unsnap-20260902

      - name: Ensure stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup stable install failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'rustup default stable failed' }

      - name: Run focused post-restore Snap regression
        shell: pwsh
        env:
          SNAP_LIVE_OUT: ${{ runner.temp }}\context-capsule-post-unsnap-${{ github.run_id }}
        run: cargo test --test windows_snap_live live_forced_final_pass_does_not_unsnap_after_foreground_reconciliation -- --ignored --nocapture --test-threads=1
