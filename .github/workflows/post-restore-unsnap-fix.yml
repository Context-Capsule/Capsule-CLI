name: Post Restore Unsnap Fix Validation

on:
  push:
    branches:
      - 'fix/post-restore-unsnap-20260902'

jobs:
  validate:
    if: github.actor == 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected POTUS, got '${{ runner.name }}'" }

      - uses: actions/checkout@v4
        with:
          ref: fix/post-restore-unsnap-20260902

      - name: Ensure stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup stable install failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'rustup default stable failed' }

      - name: Verify clean diff syntax
        shell: pwsh
        run: git diff --check origin/main...HEAD

      - name: Run Rust test suite
        shell: pwsh
        run: cargo test --all-targets

      - name: Run focused post-restore Snap regression
        shell: pwsh
        env:
          SNAP_LIVE_OUT: ${{ runner.temp }}\context-capsule-post-unsnap-${{ github.run_id }}
        run: cargo test --test windows_snap_live live_forced_final_pass_does_not_unsnap_after_foreground_reconciliation -- --ignored --nocapture --test-threads=1

      - name: Upload live validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-restore-unsnap-${{ github.run_id }}
          path: ${{ runner.temp }}\context-capsule-post-unsnap-${{ github.run_id }}
          if-no-files-found: warn
