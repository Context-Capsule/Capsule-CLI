name: Rust

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  check-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Run inspect
        run: cargo run -- inspect

      - name: Run apps
        run: cargo run -- apps
