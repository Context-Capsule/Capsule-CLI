name: Rust

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Toolchain discovery smoke test
        run: cargo run -- inspect --tools

      - name: Terminal discovery smoke test
        run: cargo run -- terminal inspect --json

      - name: Persistence CLI lifecycle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CONTEXT_CAPSULE_DB: ${{ runner.temp }}/context-capsule-persistence.db
        run: |
          set -euo pipefail
          cargo run --quiet -- save ci-persistence
          cargo run --quiet -- list | grep -F 'ci-persistence'
          cargo run --quiet -- show ci-persistence --json > "$RUNNER_TEMP/capsule.json"
          grep -F '"schema_version": 1' "$RUNNER_TEMP/capsule.json"
          grep -F '"docker"' "$RUNNER_TEMP/capsule.json"
          grep -F '"terminals"' "$RUNNER_TEMP/capsule.json"

          if cargo run --quiet -- save CI-PERSISTENCE; then
            echo 'duplicate save unexpectedly succeeded without --force' >&2
            exit 1
          fi

          cargo run --quiet -- save ci-persistence --force
          cargo run --quiet -- delete CI-PERSISTENCE
          if cargo run --quiet -- show ci-persistence; then
            echo 'deleted capsule was still loadable' >&2
            exit 1
          fi

      - name: Persistence CLI lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CONTEXT_CAPSULE_DB: ${{ runner.temp }}\context-capsule-persistence.db
        run: |
          cargo run --quiet -- save ci-persistence

          $list = cargo run --quiet -- list | Out-String
          if ($list -notmatch 'ci-persistence') {
            throw 'saved capsule was not listed'
          }

          $json = cargo run --quiet -- show ci-persistence --json | Out-String
          if ($json -notmatch '"schema_version"\s*:\s*1') {
            throw 'stored capsule schema version was not present'
          }
          if ($json -notmatch '"docker"') {
            throw 'stored capsule did not contain Docker metadata'
          }
          if ($json -notmatch '"terminals"') {
            throw 'stored capsule did not contain terminal metadata'
          }

          cargo run --quiet -- save CI-PERSISTENCE
          if ($LASTEXITCODE -eq 0) {
            throw 'duplicate save unexpectedly succeeded without --force'
          }

          cargo run --quiet -- save ci-persistence --force
          if ($LASTEXITCODE -ne 0) { throw 'forced replacement failed' }
          cargo run --quiet -- delete CI-PERSISTENCE
          if ($LASTEXITCODE -ne 0) { throw 'delete failed' }
          cargo run --quiet -- show ci-persistence
          if ($LASTEXITCODE -eq 0) {
            throw 'deleted capsule was still loadable'
          }
          $LASTEXITCODE = 0

      - name: Installed Node tools must be discovered
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = cargo run --quiet -- inspect --tools | Out-String
          $tools = @(
            @{ Command = 'node'; Label = 'Node.js' },
            @{ Command = 'npm'; Label = 'npm' },
            @{ Command = 'npx'; Label = 'npx' },
            @{ Command = 'pnpm'; Label = 'pnpm' }
          )

          foreach ($tool in $tools) {
            $installed = Get-Command $tool.Command -ErrorAction SilentlyContinue
            if (-not $installed) {
              Write-Host "$($tool.Command) is not installed on this runner; skipping assertion."
              continue
            }

            Write-Host "$($tool.Command) is installed at $($installed.Source)"
            & $tool.Command --version

            $pattern = "(?m)^\s+$([regex]::Escape($tool.Label))\s+"
            if ($output -notmatch $pattern) {
              Write-Host "Context Capsule tool output:"
              Write-Host $output
              throw "$($tool.Command) is installed but was not reported by capsule inspect --tools"
            }
          }

  windows-discovery:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Full discovery
        run: cargo run -- inspect --verbose

      - name: Application discovery
        run: cargo run -- inspect --apps

      - name: Window discovery
        run: cargo run -- inspect --windows

      - name: Classification diagnostics
        run: cargo run -- inspect --processes

      - name: Ignored-candidate diagnostics
        run: cargo run -- inspect --ignored

      - name: Docker discovery
        run: cargo run -- inspect --docker

      - name: Terminal discovery
        run: cargo run -- inspect --terminals

      - name: Deterministic Windows Terminal and WSL state fixture
        shell: pwsh
        run: |
          $statePath = Join-Path $env:RUNNER_TEMP 'context-capsule-terminal-state.json'
          @'
          {
            "persistedWindowLayouts": [
              {
                "name": "Context Capsule CI",
                "initialPosition": "120,80",
                "initialSize": { "width": 1200.0, "height": 760.0 },
                "launchMode": "default",
                "tabLayout": [
                  {
                    "action": "newTab",
                    "profile": "PowerShell",
                    "commandline": "pwsh.exe",
                    "startingDirectory": "C:\\work\\capsule",
                    "tabTitle": "PowerShell"
                  },
                  {
                    "action": "splitPane",
                    "profile": "Ubuntu",
                    "commandline": "wsl.exe -d Ubuntu",
                    "startingDirectory": "//wsl.localhost/Ubuntu/home/dhia/project",
                    "split": "right",
                    "size": 0.5
                  }
                ]
              }
            ]
          }
          '@ | Set-Content -Path $statePath -Encoding utf8

          $env:CONTEXT_CAPSULE_TERMINAL_STATE_PATH = $statePath
          $jsonText = cargo run --quiet -- terminal inspect --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'terminal fixture inspection failed' }
          $snapshot = $jsonText | ConvertFrom-Json

          if ($snapshot.windows_terminal_layouts.Count -ne 1) {
            throw 'Windows Terminal layout was not captured from fixture'
          }
          if ($snapshot.windows_terminal_layouts[0].actions.Count -ne 2) {
            throw 'Windows Terminal tab/pane actions were not preserved'
          }
          if ($snapshot.history.captured -ne $false) {
            throw 'terminal history policy unexpectedly captured history'
          }

          $powerShell = @($snapshot.sessions | Where-Object {
            $_.profile -eq 'PowerShell' -and $_.sources -contains 'windows-terminal-state'
          }) | Select-Object -First 1
          if (-not $powerShell) { throw 'PowerShell Windows Terminal session was not captured' }
          if ($powerShell.working_directory -ne 'C:\work\capsule') {
            throw "PowerShell CWD mismatch: $($powerShell.working_directory)"
          }
          if ($powerShell.restart.executable -ne 'wt.exe') {
            throw 'PowerShell restart plan did not target Windows Terminal'
          }

          $ubuntu = @($snapshot.sessions | Where-Object {
            $_.profile -eq 'Ubuntu' -and $_.sources -contains 'windows-terminal-state'
          }) | Select-Object -First 1
          if (-not $ubuntu) { throw 'Ubuntu Windows Terminal pane was not captured' }
          if ($ubuntu.environment.kind -ne 'wsl' -or $ubuntu.environment.distro -ne 'Ubuntu') {
            throw 'Ubuntu pane was not classified as WSL Ubuntu'
          }
          if ($ubuntu.working_directory -ne '//wsl.localhost/Ubuntu/home/dhia/project') {
            throw "Ubuntu pane CWD mismatch: $($ubuntu.working_directory)"
          }

          Write-Host 'Deterministic Windows Terminal + WSL semantic capture passed.'

      - name: Compatibility apps command
        run: cargo run -- apps

  docker-integration:
    runs-on: ubuntu-latest
    env:
      CONTEXT_CAPSULE_DB: /tmp/context-capsule-docker.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Verify Docker engine and Compose
        run: |
          docker version
          docker compose version

      - name: Restore an existing standalone container
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f capsule-standalone-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          docker run -d --name capsule-standalone-ci alpine:3.20 sleep 300
          cargo run --quiet -- save standalone-ci
          cargo run --quiet -- show standalone-ci --json | grep -F 'capsule-standalone-ci'

          docker stop capsule-standalone-ci
          test "$(docker inspect --format '{{.State.Running}}' capsule-standalone-ci)" = 'false'

          cargo run --quiet -- docker restore standalone-ci
          test "$(docker inspect --format '{{.State.Running}}' capsule-standalone-ci)" = 'true'

      - name: Recreate a Compose project from saved intent
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/context-capsule-compose-ci"
          mkdir -p "$project_dir"
          cat > "$project_dir/compose.yml" <<'YAML'
          services:
            worker:
              image: alpine:3.20
              command: ["sleep", "300"]
          YAML

          cleanup() {
            docker compose -f "$project_dir/compose.yml" -p capsule-compose-ci down --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          docker compose -f "$project_dir/compose.yml" -p capsule-compose-ci up -d
          cargo run --quiet -- save compose-ci
          cargo run --quiet -- show compose-ci --json | grep -F 'capsule-compose-ci'

          docker compose -f "$project_dir/compose.yml" -p capsule-compose-ci down
          if docker ps --filter 'label=com.docker.compose.project=capsule-compose-ci' --filter status=running -q | grep -q .; then
            echo 'Compose project was still running after docker compose down' >&2
            exit 1
          fi

          cargo run --quiet -- docker restore compose-ci
          docker ps --filter 'label=com.docker.compose.project=capsule-compose-ci' --filter status=running -q | grep -q .
