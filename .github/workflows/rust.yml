name: Rust

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, Windows, X64, POTUS]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets

      - name: Full test suite
        run: cargo test

      - name: Terminal ownership and CWD regression tests
        run: cargo test terminal_context::tests -- --nocapture

      - name: Display setup regression tests
        run: cargo test display_setup::tests -- --nocapture

      - name: Build all binaries
        run: cargo build --bins

      - name: Toolchain discovery smoke test
        run: cargo run -- inspect --tools

      - name: Terminal discovery smoke test
        run: cargo run -- terminal inspect --json

      - name: Persistence and new snapshot metadata lifecycle
        shell: pwsh
        env:
          CONTEXT_CAPSULE_DB: ${{ runner.temp }}\context-capsule-persistence.db
        run: |
          Remove-Item $env:CONTEXT_CAPSULE_DB -Force -ErrorAction SilentlyContinue

          $saveOutput = cargo run --quiet -- save ci-persistence | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'initial save failed' }
          if ($saveOutput -match '(?m)^\s*Docker:') {
            throw "save emitted the Docker-unavailable warning that should be suppressed:`n$saveOutput"
          }

          $list = cargo run --quiet -- list | Out-String
          if ($list -notmatch 'ci-persistence') {
            throw 'saved capsule was not listed'
          }

          $jsonText = cargo run --quiet -- show ci-persistence --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'show --json failed' }
          $stored = $jsonText | ConvertFrom-Json

          if ($stored.schema_version -ne 1) {
            throw 'stored capsule schema version was not present'
          }
          if (-not $stored.snapshot.docker) {
            throw 'stored capsule did not contain Docker metadata'
          }
          if (-not $stored.snapshot.terminals) {
            throw 'stored capsule did not contain terminal metadata'
          }
          if (-not $stored.snapshot.display_setup) {
            throw 'stored capsule did not contain display_setup metadata'
          }
          if ($stored.snapshot.display_setup.schema_version -ne 1) {
            throw 'display_setup schema version was not 1'
          }
          if ($stored.snapshot.display_setup.status -eq 'available') {
            if ([int]$stored.snapshot.display_setup.display_count -lt 1) {
              throw 'available display_setup reported no displays'
            }
            if ([string]::IsNullOrWhiteSpace([string]$stored.snapshot.display_setup.topology_signature)) {
              throw 'available display_setup did not contain a topology signature'
            }
          }

          cargo run --quiet -- save CI-PERSISTENCE
          if ($LASTEXITCODE -eq 0) {
            throw 'duplicate save unexpectedly succeeded without --force'
          }

          cargo run --quiet -- save ci-persistence --force
          if ($LASTEXITCODE -ne 0) { throw 'forced replacement failed' }
          cargo run --quiet -- delete CI-PERSISTENCE
          if ($LASTEXITCODE -ne 0) { throw 'delete failed' }
          cargo run --quiet -- show ci-persistence
          if ($LASTEXITCODE -eq 0) {
            throw 'deleted capsule was still loadable'
          }
          $global:LASTEXITCODE = 0

      - name: Installed Node tools must be discovered
        shell: pwsh
        run: |
          $output = cargo run --quiet -- inspect --tools | Out-String
          $tools = @(
            @{ Command = 'node'; Label = 'Node.js' },
            @{ Command = 'npm'; Label = 'npm' },
            @{ Command = 'npx'; Label = 'npx' },
            @{ Command = 'pnpm'; Label = 'pnpm' }
          )

          foreach ($tool in $tools) {
            $installed = Get-Command $tool.Command -ErrorAction SilentlyContinue
            if (-not $installed) {
              Write-Host "$($tool.Command) is not installed on POTUS; skipping assertion."
              continue
            }

            Write-Host "$($tool.Command) is installed at $($installed.Source)"
            & $tool.Command --version

            $pattern = "(?m)^\s+$([regex]::Escape($tool.Label))\s+"
            if ($output -notmatch $pattern) {
              Write-Host "Context Capsule tool output:"
              Write-Host $output
              throw "$($tool.Command) is installed but was not reported by capsule inspect --tools"
            }
          }

  windows-discovery:
    runs-on: [self-hosted, Windows, X64, POTUS]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Full discovery
        run: cargo run -- inspect --verbose

      - name: Application discovery
        run: cargo run -- inspect --apps

      - name: Window discovery
        run: cargo run -- inspect --windows

      - name: Classification diagnostics
        run: cargo run -- inspect --processes

      - name: Ignored-candidate diagnostics
        run: cargo run -- inspect --ignored

      - name: Docker discovery
        run: cargo run -- inspect --docker

      - name: Terminal discovery
        run: cargo run -- inspect --terminals

      - name: Deterministic Windows Terminal and WSL state fixture
        shell: pwsh
        run: |
          $statePath = Join-Path $env:RUNNER_TEMP 'context-capsule-terminal-state.json'
          @'
          {
            "persistedWindowLayouts": [
              {
                "name": "Context Capsule CI",
                "initialPosition": "120,80",
                "initialSize": { "width": 1200.0, "height": 760.0 },
                "launchMode": "default",
                "tabLayout": [
                  {
                    "action": "newTab",
                    "profile": "PowerShell",
                    "commandline": "pwsh.exe",
                    "startingDirectory": "C:\\work\\capsule",
                    "tabTitle": "PowerShell"
                  },
                  {
                    "action": "splitPane",
                    "profile": "Ubuntu",
                    "commandline": "wsl.exe -d Ubuntu",
                    "startingDirectory": "//wsl.localhost/Ubuntu/home/dhia/project",
                    "split": "right",
                    "size": 0.5
                  }
                ]
              }
            ]
          }
          '@ | Set-Content -Path $statePath -Encoding utf8

          $env:CONTEXT_CAPSULE_TERMINAL_STATE_PATH = $statePath
          $jsonText = cargo run --quiet -- terminal inspect --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'terminal fixture inspection failed' }
          $snapshot = $jsonText | ConvertFrom-Json

          if ($snapshot.windows_terminal_layouts.Count -ne 1) {
            throw 'Windows Terminal layout was not captured from fixture'
          }
          if ($snapshot.windows_terminal_layouts[0].actions.Count -ne 2) {
            throw 'Windows Terminal tab/pane actions were not preserved'
          }
          if ($snapshot.history.captured -ne $false) {
            throw 'terminal history policy unexpectedly captured history'
          }

          $powerShell = @($snapshot.sessions | Where-Object {
            $_.profile -eq 'PowerShell' -and $_.sources -contains 'windows-terminal-state'
          }) | Select-Object -First 1
          if (-not $powerShell) { throw 'PowerShell Windows Terminal session was not captured' }
          if ($powerShell.working_directory -ne 'C:\work\capsule') {
            throw "PowerShell CWD mismatch: $($powerShell.working_directory)"
          }
          if ($powerShell.restart.executable -ne 'wt.exe') {
            throw 'PowerShell restart plan did not target Windows Terminal'
          }

          $ubuntu = @($snapshot.sessions | Where-Object {
            $_.profile -eq 'Ubuntu' -and $_.sources -contains 'windows-terminal-state'
          }) | Select-Object -First 1
          if (-not $ubuntu) { throw 'Ubuntu Windows Terminal pane was not captured' }
          if ($ubuntu.environment.kind -ne 'wsl' -or $ubuntu.environment.distro -ne 'Ubuntu') {
            throw 'Ubuntu pane was not classified as WSL Ubuntu'
          }
          if ($ubuntu.working_directory -ne '//wsl.localhost/Ubuntu/home/dhia/project') {
            throw "Ubuntu pane CWD mismatch: $($ubuntu.working_directory)"
          }

          Write-Host 'Deterministic Windows Terminal + WSL semantic capture passed.'

      - name: Compatibility apps command
        run: cargo run -- apps

  docker-integration:
    runs-on: [self-hosted, Windows, X64, POTUS]
    env:
      CONTEXT_CAPSULE_DB: ${{ runner.temp }}\context-capsule-docker.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Verify Docker engine and Compose
        shell: pwsh
        run: |
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            throw 'Docker CLI is not installed on POTUS'
          }
          docker version
          if ($LASTEXITCODE -ne 0) { throw 'Docker engine is not available on POTUS' }
          docker compose version
          if ($LASTEXITCODE -ne 0) { throw 'Docker Compose is not available on POTUS' }

      - name: Restore an existing standalone container
        shell: pwsh
        run: |
          docker rm -f capsule-standalone-ci 2>$null | Out-Null
          try {
            docker run -d --name capsule-standalone-ci alpine:3.20 sleep 300 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'could not start standalone test container' }

            cargo run --quiet -- save standalone-ci
            if ($LASTEXITCODE -ne 0) { throw 'standalone capsule save failed' }
            $json = cargo run --quiet -- show standalone-ci --json | Out-String
            if ($json -notmatch 'capsule-standalone-ci') { throw 'standalone container was not saved' }

            docker stop capsule-standalone-ci | Out-Null
            $running = docker inspect --format '{{.State.Running}}' capsule-standalone-ci
            if ($running.Trim() -ne 'false') { throw 'standalone container did not stop' }

            cargo run --quiet -- docker restore standalone-ci
            if ($LASTEXITCODE -ne 0) { throw 'standalone Docker restore failed' }
            $running = docker inspect --format '{{.State.Running}}' capsule-standalone-ci
            if ($running.Trim() -ne 'true') { throw 'standalone container was not restored' }
          }
          finally {
            docker rm -f capsule-standalone-ci 2>$null | Out-Null
          }

      - name: Recreate a Compose project from saved intent
        shell: pwsh
        run: |
          $projectDir = Join-Path $env:RUNNER_TEMP 'context-capsule-compose-ci'
          New-Item -ItemType Directory -Path $projectDir -Force | Out-Null
          $composePath = Join-Path $projectDir 'compose.yml'
          @'
          services:
            worker:
              image: alpine:3.20
              command: ["sleep", "300"]
          '@ | Set-Content -Path $composePath -Encoding utf8

          docker compose -f $composePath -p capsule-compose-ci down --remove-orphans 2>$null | Out-Null
          try {
            docker compose -f $composePath -p capsule-compose-ci up -d
            if ($LASTEXITCODE -ne 0) { throw 'could not start Compose test project' }

            cargo run --quiet -- save compose-ci
            if ($LASTEXITCODE -ne 0) { throw 'Compose capsule save failed' }
            $json = cargo run --quiet -- show compose-ci --json | Out-String
            if ($json -notmatch 'capsule-compose-ci') { throw 'Compose project was not saved' }

            docker compose -f $composePath -p capsule-compose-ci down
            if ($LASTEXITCODE -ne 0) { throw 'Compose down failed' }
            $running = @(docker ps --filter 'label=com.docker.compose.project=capsule-compose-ci' --filter status=running -q)
            if ($running.Count -gt 0 -and -not [string]::IsNullOrWhiteSpace(($running -join ''))) {
              throw 'Compose project was still running after docker compose down'
            }

            cargo run --quiet -- docker restore compose-ci
            if ($LASTEXITCODE -ne 0) { throw 'Compose Docker restore failed' }
            $running = @(docker ps --filter 'label=com.docker.compose.project=capsule-compose-ci' --filter status=running -q)
            if ($running.Count -eq 0 -or [string]::IsNullOrWhiteSpace(($running -join ''))) {
              throw 'Compose project was not restored'
            }
          }
          finally {
            docker compose -f $composePath -p capsule-compose-ci down --remove-orphans 2>$null | Out-Null
          }
