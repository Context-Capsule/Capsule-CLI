name: Rust

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Toolchain discovery smoke test
        run: cargo run -- inspect --tools

  windows-discovery:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Full discovery
        run: cargo run -- inspect --verbose

      - name: Application discovery
        run: cargo run -- inspect --apps

      - name: Window discovery
        run: cargo run -- inspect --windows

      - name: Classification diagnostics
        run: cargo run -- inspect --processes

      - name: Ignored-candidate diagnostics
        run: cargo run -- inspect --ignored

      - name: Compatibility apps command
        run: cargo run -- apps
