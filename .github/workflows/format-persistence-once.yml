name: Format persistence once

on:
  push:
    branches:
      - agent/sqlite-persistence-docker-adapter

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Context Capsule CI"
          git config user.email "actions@users.noreply.github.com"
          git add src Cargo.toml
          git commit -m "format persistence and docker code"
          git push origin HEAD:${GITHUB_REF_NAME}
