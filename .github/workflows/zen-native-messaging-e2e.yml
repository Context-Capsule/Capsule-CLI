name: Zen Native Messaging E2E

on:
  push:
    branches: [main, 'agent/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zen-native-messaging:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected runner POTUS, got '${{ runner.name }}'" }

      - uses: actions/checkout@v4
      - name: Ensure stable Rust toolchain
        shell: pwsh
        run: |
          Get-Command rustup -ErrorAction Stop | Format-List Source
          rustup toolchain install stable --component rustfmt --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup stable install failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'rustup default stable failed' }
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'rustc is unavailable after rustup setup' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'cargo is unavailable after rustup setup' }
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned web-ext test runner
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock web-ext@10.6.0
          $webExt = Join-Path $PWD 'node_modules\.bin\web-ext.cmd'
          if (-not (Test-Path $webExt)) { throw 'web-ext.cmd was not installed' }
          & $webExt --version
          "WEB_EXT_BIN=$webExt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure isolated native-host test paths
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'com.contextcapsule.host.json'
          $state = Join-Path $env:RUNNER_TEMP 'zen-firefox-state.json'
          $isolatedLocalAppData = Join-Path $env:RUNNER_TEMP 'context-capsule-native-localappdata'
          $registryBackup = Join-Path $env:RUNNER_TEMP 'context-capsule-native-registry-backup.txt'
          New-Item -ItemType Directory -Force -Path $isolatedLocalAppData | Out-Null

          # The self-hosted POTUS runner shares the interactive Windows user.
          # Back up the real native-host registration before the E2E changes it,
          # then restore it in an always() cleanup step below.
          $key = 'HKCU\Software\Mozilla\NativeMessagingHosts\com.contextcapsule.host'
          $output = & reg.exe query $key /ve 2>$null
          $existing = ''
          if ($LASTEXITCODE -eq 0) {
            $line = $output | Where-Object { $_ -match 'REG_SZ' } | Select-Object -First 1
            if ($line -and ($line -match 'REG_SZ\s+(.+)$')) { $existing = $Matches[1].Trim().Trim('"') }
          }
          Set-Content -Path $registryBackup -Value $existing -NoNewline
          $global:LASTEXITCODE = 0

          "CONTEXT_CAPSULE_FIREFOX_MANIFEST_PATH=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CONTEXT_CAPSULE_FIREFOX_STATE_PATH=$state" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CONTEXT_CAPSULE_E2E_LOCALAPPDATA=$isolatedLocalAppData" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CONTEXT_CAPSULE_E2E_REGISTRY_BACKUP=$registryBackup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, install, and diagnose the Rust native host
        shell: pwsh
        run: |
          cargo build --bin capsule-firefox-host

          # pin_windows_native_host_executable uses LOCALAPPDATA for durable host
          # copies. Point only this install at RUNNER_TEMP so stale-copy cleanup
          # can never delete the host executable used by the interactive user.
          $realLocalAppData = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = $env:CONTEXT_CAPSULE_E2E_LOCALAPPDATA
            .\target\debug\capsule-firefox-host.exe --install
            if ($LASTEXITCODE -ne 0) { throw 'isolated Firefox native-host install failed' }
            .\target\debug\capsule-firefox-host.exe --doctor
            if ($LASTEXITCODE -ne 0) { throw 'isolated Firefox native-host doctor failed' }
          }
          finally {
            $env:LOCALAPPDATA = $realLocalAppData
          }

      - name: Install latest official Zen Browser
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/zen-browser/desktop/releases/latest' -Headers @{ 'User-Agent' = 'Context-Capsule-CI' }
          $asset = $release.assets | Where-Object { $_.name -eq 'zen.installer.exe' } | Select-Object -First 1
          if (-not $asset) { throw 'latest Zen release has no zen.installer.exe' }
          $installer = Join-Path $env:RUNNER_TEMP 'zen.installer.exe'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010, 1641)) { throw "Zen installer failed with exit code $($install.ExitCode)" }
          $zen = @(
            "$env:ProgramW6432\Zen Browser\zen.exe",
            "$env:ProgramFiles\Zen Browser\zen.exe",
            "${env:ProgramFiles(x86)}\Zen Browser\zen.exe",
            "$env:LOCALAPPDATA\Zen Browser\zen.exe",
            "$env:LOCALAPPDATA\Programs\Zen Browser\zen.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $zen) { throw 'Zen installed but zen.exe was not found' }
          Write-Host "Using Zen: $zen"
          (Get-Item $zen).VersionInfo | Format-List FileVersion,ProductVersion
          "ZEN_EXE=$zen" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launch probe extension in Zen and wait for Rust host state
        shell: pwsh
        run: |
          Remove-Item $env:CONTEXT_CAPSULE_FIREFOX_STATE_PATH -Force -ErrorAction SilentlyContinue
          $stdout = Join-Path $env:RUNNER_TEMP 'zen-native-probe.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'zen-native-probe.stderr.log'
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $arguments = "run --source-dir `"$PWD\tests\native_probe`" --firefox `"$env:ZEN_EXE`" --no-input"
          $process = Start-Process -FilePath $env:WEB_EXT_BIN -ArgumentList $arguments -WorkingDirectory $PWD -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(90)
          $passed = $false
          try {
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $env:CONTEXT_CAPSULE_FIREFOX_STATE_PATH) {
                $state = Get-Content $env:CONTEXT_CAPSULE_FIREFOX_STATE_PATH -Raw
                if ($state -match [regex]::Escape('https://zen-native-host-ci.example/')) { $passed = $true; break }
              }
              if ($process.HasExited) { break }
            }
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
              $global:LASTEXITCODE = 0
            }
          }
          Write-Host '----- web-ext stdout -----'
          if (Test-Path $stdout) { Get-Content $stdout -Raw | Write-Host }
          Write-Host '----- web-ext stderr -----'
          if (Test-Path $stderr) { Get-Content $stderr -Raw | Write-Host }
          if (-not $passed) {
            if ($process.HasExited) { throw "web-ext/Zen exited before native state arrived. Exit code: $($process.ExitCode)" }
            throw 'Zen never delivered the WebExtension native message to the Context Capsule Rust host'
          }
          .\target\debug\capsule-firefox-host.exe --status | Tee-Object -Variable hostStatus
          if (($hostStatus -join "`n") -notmatch 'adapter: live') { throw 'native host received state but --status did not report a live adapter' }
          Write-Host 'Zen -> WebExtension -> Windows NativeMessagingHosts -> Rust host integration passed.'

      - name: Restore interactive user's native-host registration
        if: always()
        shell: pwsh
        run: |
          $key = 'HKCU\Software\Mozilla\NativeMessagingHosts\com.contextcapsule.host'
          $existing = ''
          if (Test-Path $env:CONTEXT_CAPSULE_E2E_REGISTRY_BACKUP) {
            $existing = (Get-Content $env:CONTEXT_CAPSULE_E2E_REGISTRY_BACKUP -Raw).Trim()
          }
          if ($existing) {
            & reg.exe add $key /ve /t REG_SZ /d $existing /f | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'failed to restore the pre-E2E native-host registration' }
            Write-Host "Restored native-host registration -> $existing"
          }
          else {
            & reg.exe delete $key /f 2>$null | Out-Null
            $global:LASTEXITCODE = 0
            Write-Host 'Removed temporary native-host registration because no pre-E2E registration existed.'
          }

      - name: Publish Zen E2E status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } elseif ($env:JOB_STATUS -eq 'cancelled') { 'error' } else { 'failure' }
          $body = @{
            state = $state
            context = 'ci/potus-zen-e2e'
            description = "POTUS Zen E2E: $($env:JOB_STATUS)"
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
