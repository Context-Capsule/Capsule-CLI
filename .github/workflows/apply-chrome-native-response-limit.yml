name: Apply Terminal CWD Regression Fix

on:
  push:
    branches: ['feature/chrome-browser-adapter-20260822']
    paths: ['.github/workflows/apply-chrome-native-response-limit.yml']

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chrome-browser-adapter-20260822
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply regression patch
        run: python scripts/apply-terminal-cwd-regression.py
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo test terminal_context -- --nocapture
      - run: cargo test restore::semantic -- --nocapture
      - run: cargo test chrome -- --nocapture
      - run: cargo test --all -- --nocapture
      - name: Commit only after verification passes
        shell: pwsh
        run: |
          git rm .github/workflows/apply-chrome-native-response-limit.yml scripts/apply-terminal-cwd-regression.py
          git add src/terminal_context.rs src/adapters/terminal.rs src/chrome.rs
          git config user.name 'GPT-Slave'
          git config user.email '313162660+GPT-Slave@users.noreply.github.com'
          git commit -m 'fix: restore Windows terminals in captured live directory'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push origin HEAD:feature/chrome-browser-adapter-20260822
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
