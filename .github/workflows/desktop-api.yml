name: Desktop API

on:
  push:
    branches:
      - validation/restore-cwd-service-20260830
    paths:
      - 'scripts/apply-restore-cwd-service-fix.mjs'
      - 'scripts/apply-restore-cwd-service-safety.mjs'
      - 'src/commands.rs'
      - 'src/service_restart.rs'
      - 'src/terminal_context.rs'
      - '.github/workflows/desktop-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-cwd-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected POTUS, got '${{ runner.name }}'" }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --component rustfmt --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup install failed' }
          rustup default stable
          rustc --version
          cargo --version
      - name: Validate and apply guarded source patches
        shell: pwsh
        run: |
          node --check scripts/apply-restore-cwd-service-fix.mjs
          if ($LASTEXITCODE -ne 0) { throw 'main patch script syntax check failed' }
          node --check scripts/apply-restore-cwd-service-safety.mjs
          if ($LASTEXITCODE -ne 0) { throw 'safety patch script syntax check failed' }
          node scripts/apply-restore-cwd-service-fix.mjs
          if ($LASTEXITCODE -ne 0) { throw 'guarded main patch failed' }
          node scripts/apply-restore-cwd-service-safety.mjs
          if ($LASTEXITCODE -ne 0) { throw 'guarded safety patch failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'patched tree has whitespace errors' }
          git diff --stat
      - name: Format changed Rust files only
        shell: pwsh
        run: |
          rustfmt --edition 2024 src\commands.rs src\service_restart.rs src\terminal_context.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt failed on changed files' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'formatted patch has whitespace errors' }
      - name: Focused terminal context tests
        run: cargo test terminal_context::tests -- --nocapture
      - name: Focused restore command tests
        run: cargo test commands::tests -- --nocapture
      - name: Focused service restart tests
        run: cargo test service_restart::tests -- --nocapture
      - name: Check all Rust targets
        run: cargo check --all-targets
      - name: Full Rust test suite
        run: cargo test --all-targets
      - name: Build all binaries
        run: cargo build --bins
      - name: Verify terminal send-text path in isolated PowerShell console
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'context-capsule-send-text-smoke'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $marker = Join-Path $dir 'marker.txt'
          $escapedMarker = $marker.Replace("'", "''")
          $process = Start-Process powershell.exe -ArgumentList '-NoLogo','-NoProfile','-NoExit' -WorkingDirectory $dir -PassThru
          try {
            Start-Sleep -Milliseconds 700
            $command = "Set-Content -LiteralPath '$escapedMarker' -Value 'send-text-ok'"
            & .\target\debug\capsule-agent-worker.exe __capsule-console-control send-text $process.Id $command
            if ($LASTEXITCODE -ne 0) { throw 'terminal send-text helper failed' }
            $deadline = (Get-Date).AddSeconds(5)
            while (-not (Test-Path $marker) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100 }
            if (-not (Test-Path $marker)) { throw 'injected PowerShell command did not execute' }
            if ((Get-Content $marker -Raw).Trim() -ne 'send-text-ok') { throw 'unexpected send-text marker content' }
            Write-Host 'isolated terminal send-text smoke passed'
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Show product-only diff
        shell: pwsh
        run: git diff -- src/commands.rs src/service_restart.rs src/terminal_context.rs

  validate-linux:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Verify POTUS-linux runner
        shell: bash
        run: test '${{ runner.name }}' = 'POTUS-linux'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply guarded source patches
        run: |
          node --check scripts/apply-restore-cwd-service-fix.mjs
          node --check scripts/apply-restore-cwd-service-safety.mjs
          node scripts/apply-restore-cwd-service-fix.mjs
          node scripts/apply-restore-cwd-service-safety.mjs
          git diff --check
      - name: Format changed Rust files only
        run: |
          rustfmt --edition 2024 src/commands.rs src/service_restart.rs src/terminal_context.rs
          git diff --check
      - name: Check all targets
        run: cargo check --all-targets
      - name: Full tests
        run: cargo test --all-targets
