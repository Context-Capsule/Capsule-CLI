name: Restore Engine

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'src/restore/**'
      - 'src/commands.rs'
      - 'src/main.rs'
      - 'src/lib.rs'
      - 'tests/restore_geometry.rs'
      - '.github/workflows/restore-engine.yml'
  pull_request:
    paths:
      - 'src/restore/**'
      - 'src/commands.rs'
      - 'src/main.rs'
      - 'src/lib.rs'
      - 'tests/restore_geometry.rs'
      - '.github/workflows/restore-engine.yml'

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --all-targets
      - name: Restore unit tests
        run: cargo test restore
      - name: Restore geometry integration tests
        run: cargo test --test restore_geometry
      - name: CLI restore parser tests
        run: cargo test restore_parser
      - name: Build capsule
        run: cargo build --bin capsule

      - name: Safe save -> restore dry-run lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CONTEXT_CAPSULE_DB: ${{ runner.temp }}\restore-engine.db
        run: |
          cargo run --quiet -- save restore-engine-ci
          if ($LASTEXITCODE -ne 0) { throw 'save failed' }
          cargo run --quiet -- restore restore-engine-ci --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'restore dry run failed' }

      - name: Safe save -> restore dry-run lifecycle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CONTEXT_CAPSULE_DB: ${{ runner.temp }}/restore-engine.db
        run: |
          set -euo pipefail
          cargo run --quiet -- save restore-engine-ci
          cargo run --quiet -- restore restore-engine-ci --dry-run
