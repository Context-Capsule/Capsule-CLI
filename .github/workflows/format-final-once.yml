name: Format final once

on:
  push:
    branches:
      - agent/windows-discovery-snapshot

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format source
        run: cargo fmt --all

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source is already formatted."
            exit 0
          fi

          git config user.name "Context Capsule CI"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "format final discovery code"
          git push origin HEAD:${GITHUB_REF_NAME}
