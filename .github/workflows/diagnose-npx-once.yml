name: Diagnose npx once

on:
  push:
    branches:
      - agent/windows-discovery-snapshot

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose npx launchers
        shell: pwsh
        run: |
          Write-Host 'Get-Command npx:'
          Get-Command npx -All | Format-List Name,CommandType,Source,Path
          Write-Host 'where.exe npx:'
          where.exe npx
          Write-Host 'Direct npx:'
          npx --version
          Write-Host 'Each npx candidate:'
          $candidates = @(where.exe npx)
          foreach ($candidate in $candidates) {
            Write-Host "--- $candidate"
            $ext = [IO.Path]::GetExtension($candidate).ToLowerInvariant()
            if ($ext -eq '.cmd' -or $ext -eq '.bat') {
              cmd.exe /D /Q /C "call `"$candidate`" --version"
            } elseif ($ext -eq '.ps1') {
              pwsh -NoProfile -File $candidate --version
            } else {
              & $candidate --version
            }
            Write-Host "exit=$LASTEXITCODE"
          }
