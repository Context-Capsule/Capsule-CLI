name: Save Restore Performance Baseline

on:
  push:
    branches:
      - 'performance/**'
    paths:
      - 'src/**'
      - '.github/workflows/performance-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-already-completed:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: No duplicate validation needed
        shell: pwsh
        run: Write-Host 'Snap-state validation already passed on the feature branch; skipping duplicate compile.'
