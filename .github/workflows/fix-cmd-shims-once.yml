name: Fix cmd shims once

on:
  push:
    branches:
      - agent/windows-discovery-snapshot

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Windows batch execution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/toolchain.rs")
          text = path.read_text()

          marker = "};\n\n#[derive(Debug, Clone, PartialEq, Eq)]"
          replacement = "};\n\n#[cfg(windows)]\nuse std::os::windows::process::CommandExt;\n\n#[derive(Debug, Clone, PartialEq, Eq)]"
          if "use std::os::windows::process::CommandExt;" not in text:
              if marker not in text:
                  raise SystemExit("could not insert Windows CommandExt import")
              text = text.replace(marker, replacement, 1)

          needle = "    let output = run_version_command(spec.command, spec.args, &executable_path)?;\n"
          guarded = needle + "    if !output.status.success() {\n        return None;\n    }\n"
          if guarded not in text:
              if needle not in text:
                  raise SystemExit("could not find tool output status insertion point")
              text = text.replace(needle, guarded, 1)

          pattern = re.compile(
              r'#\[cfg\(windows\)\]\nfn run_windows_command_shim\(.*?\n\}\n\n#\[cfg\(not\(windows\)\)\]',
              re.S,
          )
          new_function = (
              '#[cfg(windows)]\n'
              'fn run_windows_command_shim(executable_path: &str, args: &[&str]) -> Option<Output> {\n'
              '    // Batch shims cannot be launched directly through CreateProcess. Build the exact\n'
              '    // command line expected by cmd.exe and bypass Rust\'s second layer of quoting.\n'
              '    let command_line = std::iter::once(executable_path)\n'
              '        .chain(args.iter().copied())\n'
              '        .map(quote_cmd_argument)\n'
              '        .collect::<Vec<_>>()\n'
              '        .join(" ");\n\n'
              '    let mut shell = Command::new("cmd.exe");\n'
              '    shell.raw_arg(format!(r#"/D /S /C "{command_line}""#));\n'
              '    run_with_timeout(&mut shell, TOOL_VERSION_TIMEOUT)\n'
              '}\n\n'
              '#[cfg(not(windows))]'
          )
          text, count = pattern.subn(new_function, text, count=1)
          if count != 1:
              raise SystemExit("could not replace Windows batch-shim launcher")

          path.write_text(text)
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "Context Capsule CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/toolchain.rs
          git commit -m "fix Windows command shims"
          git push origin HEAD:${GITHUB_REF_NAME}
