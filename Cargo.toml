[package]
name = "context-capsule"
version = "0.1.0"
edition = "2024"
default-run = "capsule"
autobins = false

[[bin]]
name = "capsule"
path = "src/capsule_main.rs"

[[bin]]
name = "capsule-firefox-host"
path = "src/bin/firefox_host.rs"

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
